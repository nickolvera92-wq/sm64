name: Build Windows Port

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
        
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-pkg-config
            git
            make
            python3

      - name: Grab Verified Base ROM
        run: |
          curl -L "https://archive.org" -o baserom.us.z64
          if [ ! -f "baserom.us.z64" ]; then
            echo "ERROR: Download failed completely!"
            exit 1
          fi
          
          DOWNLOAD_HASH=$(md5sum baserom.us.z64 | awk '{print $1}')
          if [ "$DOWNLOAD_HASH" != "20b854b239203baf6c961b850a4a51a2" ]; then
            echo "ERROR: Hash mismatch! Expected 20b854b239203baf6c961b850a4a51a2 but got $DOWNLOAD_HASH"
            exit 1
          fi
          echo "ROM verified successfully!"

      - name: Compile Windows Executable
        run: |
          make VERSION=us -j$(nproc)

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: sm64-windows-binary
          path: build/us_pc/sm64.us.exe
