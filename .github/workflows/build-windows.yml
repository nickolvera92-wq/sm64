name: Build Windows Port

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
        
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-pkg-config
            git
            make
            python3

      - name: Fetch and Verify Clean Base ROM
        run: |
          # Download the authentic, full-size 8MB US Z64 ROM asset mirror
          curl -L "https://archive.org" -o baserom.us.z64
          
          if [ ! -f "baserom.us.z64" ]; then
            echo "ERROR: Download failed completely!"
            exit 1
          fi
          
          # Check size to ensure we grabbed the binary data and not an HTML webpage redirect
          FILE_SIZE=$(stat -c%s "baserom.us.z64")
          echo "Downloaded file size: $FILE_SIZE bytes"
          if [ $FILE_SIZE -lt 8000000 ]; then
            echo "ERROR: Grabbed an invalid or truncated file payload."
            exit 1
          fi
          
          echo "ROM retrieved and staging for extraction."

      - name: Compile Windows Executable
        run: |
          make VERSION=us COMPARE_ROM=no -j$(nproc)

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: sm64-windows-binary
          path: build/us_pc/sm64.us.exe
